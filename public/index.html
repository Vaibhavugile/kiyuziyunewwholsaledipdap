<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="author" content="Everything Wholesale Market" />

  <!-- Primary SEO -->
  <title>Everything Wholesale Market | Wholesale Products & Best Deals</title>

    name="description"
    content="Shop Everything Wholesale Market for affordable products and wholesale deals across Home & Kitchen, Home Decor, Health & Beauty, Fashion & Accessories, Toys, Office Supplies, Home Improvement, Electronics and Lifestyle."
  />

  <meta
    name="keywords"

  />

  <meta
    name="robots"
    content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"
  />

  <meta
    name="googlebot"
    content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"
  />

  <!-- Canonical URL: update if your actual domain differs -->
  <link
    rel="canonical"
    href="https://everythingwholesalemarket.com/"
  />

  <!-- Open Graph: WhatsApp, Facebook and social sharing -->
  <meta
    property="og:site_name"
    content="Everything Wholesale Market"
  />

  <meta
    property="og:title"
    content="Everything Wholesale Market | Wholesale Products & Best Deals"
  />

  <meta
    property="og:description"
    content="Explore affordable products and wholesale deals across home, kitchen, decor, beauty, fashion, toys, office, electronics and lifestyle."
  />

  <meta property="og:type" content="website" />

  <meta
    property="og:url"
    content="https://everythingwholesalemarket.com/"
  />

  <meta
    property="og:image"
    content="https://everythingwholesalemarket.com/og-image.jpg"
  />

  <meta
    property="og:image:alt"
    content="Everything Wholesale Market online shopping and wholesale deals"
  />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />

  <meta
    name="twitter:title"
    content="Everything Wholesale Market | Wholesale Products & Best Deals"
  />

  <meta
    name="twitter:description"
    content="Shop wholesale deals across everyday essentials, home, beauty, fashion, electronics and more."
  />

  <meta
    name="twitter:image"
    content="https://everythingwholesalemarket.com/og-image.jpg"
  />

  <!-- Favicon and app assets -->
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

  <link
    rel="apple-touch-icon"
    href="%PUBLIC_URL%/logo192.png"
  />

  <link
    rel="manifest"
    href="%PUBLIC_URL%/manifest.json"
  />

  <!-- Performance optimizations -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <!-- Premium typography -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Global styles -->
  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

      max-width: 100%;
    }

</head>

<body>
